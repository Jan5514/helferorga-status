# Der Wächter von außen für HelferOrga (29.09.2026).
#
# Geprüft wird genau eine Adresse: die Statusseite des ganzen Hauses. Sie
# antwortet mit 200, wenn das Programm läuft und sich alle Datenbanken lesen
# lassen, sonst mit 503 -- das Kürzel einer Organisation steht hier mit
# Absicht nicht, denn diese Seite ist öffentlich (SERVER.md 11.6).
owner: Jan5514
repo: helferorga-status

sites:
  - name: HelferOrga
    url: https://helferorga.de/status
    expectedStatusCodes:
      - 200
    maxResponseTime: 10000

# wer bei einem Ausfall das Issue zugewiesen bekommt -- und damit die Mail
assignees:
  - Jan5514

# die Beschreibung des Repositorys ist von Hand geschrieben
skipDescriptionUpdate: true
skipTopicsUpdate: true

status-website:
  cname: status.helferorga.de
  logoUrl: https://helferorga.de/zeichen.svg
  faviconSvg: https://helferorga.de/zeichen.svg
  name: HelferOrga · Status
  theme: light
  introTitle: "**HelferOrga** – der Stand von außen gesehen"
  introMessage: >-
    Diese Seite prüft alle fünf Minuten von außen, ob
    [helferorga.de](https://helferorga.de/status) antwortet und sich alle
    Datenbanken lesen lassen. Sie liegt bei GitHub und nicht auf dem Server
    von HelferOrga – deshalb ist sie auch dann erreichbar, wenn der Server es
    nicht ist. Den Stand einer einzelnen Organisation zeigt
    `<kürzel>.helferorga.de/status`.
  navbar:
    - title: Status
      href: /
    - title: HelferOrga
      href: https://helferorga.de
    - title: Impressum
      href: https://helferorga.de/impressum
    - title: Datenschutz
      href: https://helferorga.de/datenschutz

