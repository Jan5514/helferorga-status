# Der Wächter von außen für HelferOrga (29.09.2026).
#
# Der Wachhund auf dem Server merkt, wenn der Dienst klemmt -- aber nicht,
# wenn die ganze Maschine weg ist, denn dann ist er es auch. Dieser Wächter
# läuft bei GitHub und fragt alle fünf Minuten `helferorga.de/status` ab.
# Antwortet es nicht mit 200, öffnet er ein Issue, und GitHub schickt eine
# Mail. Antwortet es wieder, schließt er das Issue.
#
# Mit Absicht **keine öffentliche Seite**: wer eine Seite ausliefert, sieht
# die Adressen ihrer Besucher. Öffentlich bleibt nur die Statusseite auf dem
# eigenen Server (`/status`); hier sieht GitHub nichts als seine eigenen
# Abrufe. Mehr dazu in HelferOrga, `SERVER.md` 11.6.
name: Wächter

on:
  schedule:
    - cron: "*/5 * * * *"
    # das Lebenszeichen, siehe unten
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      adresse:
        description: "Andere Adresse prüfen -- nur zur Probe des Alarms"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

# zwei Läufe zugleich öffneten sonst zwei Issues für denselben Ausfall
concurrency:
  group: waechter
  cancel-in-progress: false

env:
  ADRESSE: ${{ inputs.adresse != '' && inputs.adresse || 'https://helferorga.de/status' }}

jobs:
  pruefen:
    if: github.event.schedule != '17 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Status abfragen
        id: frage
        run: |
          # Text und nicht die Seite: `*/*` bekommt die drei Zeilen des Wachhunds
          frage() {
            curl -s -o antwort.txt -w '%{http_code}' --max-time 20 -H 'accept: */*' "$ADRESSE" || true
          }
          code=$(frage)
          # einmal nachfragen: jede Auslieferung startet den Dienst neu, und
          # ein Lauf, der in diese zwei Sekunden fällt, ist kein Ausfall --
          # dieselbe Regel wie beim Wachhund auf dem Server
          if [ "$code" != "200" ]; then
            sleep 30
            code=$(frage)
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Antwort: $code"

      - name: Issue öffnen oder schließen
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.frage.outputs.code }}
        run: |
          jetzt=$(TZ=Europe/Berlin date +'%d.%m.%Y, %H:%M Uhr')
          # scheitert die Frage (die Marke gibt es beim ersten Mal noch nicht),
          # gilt: keins offen -- abbrechen hieße, einen Ausfall zu verschweigen
          offen=$(gh issue list -R "$GITHUB_REPOSITORY" --label ausfall --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null) || offen=""

          if [ "$CODE" = "200" ]; then
            if [ -n "$offen" ]; then
              gh issue comment "$offen" -R "$GITHUB_REPOSITORY" \
                --body "Wieder da: \`$ADRESSE\` antwortet mit 200 ($jetzt)."
              gh issue close "$offen" -R "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi

          # ein Ausfall meldet sich einmal und nicht alle fünf Minuten -- eine
          # Mail je Lauf wäre nach der zweiten Nacht eine Regel im Postfach
          [ -n "$offen" ] && exit 0

          gh label create ausfall -R "$GITHUB_REPOSITORY" --color B60205 \
            --description "helferorga.de/status antwortet nicht mit 200" 2>/dev/null || true
          {
            # 000 ist curls Wort für „keine Verbindung“ -- das liest niemand als Zahl
            if [ "$CODE" = "000" ] || [ -z "$CODE" ]; then was="antwortet **gar nicht**"; else was="antwortet mit **$CODE** statt 200"; fi
            echo "\`$ADRESSE\` $was ($jetzt, zweimal im Abstand von 30 Sekunden gefragt)."
            echo
            if [ -s antwort.txt ]; then
              echo "Was die Seite sagt (ohne Kürzel und ohne Pfade -- so ist sie gebaut):"
              echo
              echo '```'
              head -c 1500 antwort.txt
              echo
              echo '```'
            else
              echo "Keine Antwort -- der Server, die Maschine oder der Weg dorthin ist weg."
            fi
            echo
            echo "Dieses Issue schließt sich von selbst, sobald die Seite wieder mit 200 antwortet."
          } > text.md
          gh issue create -R "$GITHUB_REPOSITORY" --label ausfall \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "HelferOrga antwortet nicht ($jetzt)" --body-file text.md

  # Das Lebenszeichen: GitHub schaltet Zeitpläne in einem öffentlichen
  # Repository ab, in dem 60 Tage lang nichts passiert ist -- und dann hört
  # der Wächter still auf, ohne dass es jemand merkt. Ein Commit im Monat
  # ist das, was dagegen hilft.
  lebenszeichen:
    if: github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Datum schreiben
        run: |
          TZ=Europe/Berlin date +'%d.%m.%Y' > lebenszeichen.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lebenszeichen.txt
          git commit -m "Lebenszeichen $(cat lebenszeichen.txt)"
          git push
